[package]
name = "vesper-harness"
version = "3.2.2"
edition = "2024"
default-run = "vesper-harness"
description = "The 5-Stage Core Engine for autonomous AI coding (Aider + SWE-agent + Hermes)"
license = "MIT"
authors = ["Min <minse@example.com>"]
repository = "https://github.com/minseokk77/vesper-harness"


[dependencies]
colored = "3.1.1"
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
ratatui = "0.26"
crossterm = "0.27"
tui-input = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
